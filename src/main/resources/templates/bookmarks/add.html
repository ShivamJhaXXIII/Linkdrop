<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Bookmark - Linkdrop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <div class="max-w-2xl mx-auto">
            <!-- Header -->
            <div class="mb-8">
                <div class="flex items-center justify-between">
                    <h1 class="text-3xl font-bold text-gray-900">
                        <i class="fas fa-plus-circle text-indigo-600 mr-3"></i>
                        Add New Bookmark
                    </h1>
                    <a href="/bookmarks" class="text-indigo-600 hover:text-indigo-500 flex items-center">
                        <i class="fas fa-arrow-left mr-2"></i>
                        Back to Bookmarks
                    </a>
                </div>
                <p class="mt-2 text-gray-600">Save and organize your favorite links</p>
            </div>

            <!-- Add Bookmark Form -->
            <div class="bg-white shadow-xl rounded-lg p-8">
                <form th:action="@{/bookmarks/add}" th:object="${addBookmarkReq}" method="post" class="space-y-6">

                    <!-- URL Field -->
                    <div>
                        <label for="url" class="block text-sm font-medium text-gray-700 mb-2">
                            <i class="fas fa-link mr-2 text-gray-400"></i>URL
                        </label>
                        <input
                            type="url"
                            id="url"
                            th:field="*{url}"
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-colors"
                            placeholder="https://example.com"
                            required
                        />
                        <div th:if="${#fields.hasErrors('url')}" class="mt-1 text-sm text-red-600">
                            <i class="fas fa-exclamation-circle mr-1"></i>
                            <span th:errors="*{url}"></span>
                        </div>
                    </div>

                    <!-- Title Field -->
                    <div>
                        <label for="title" class="block text-sm font-medium text-gray-700 mb-2">
                            <i class="fas fa-heading mr-2 text-gray-400"></i>Title
                        </label>
                        <input
                            type="text"
                            id="title"
                            th:field="*{title}"
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-colors"
                            placeholder="Enter bookmark title"
                            required
                        />
                        <div th:if="${#fields.hasErrors('title')}" class="mt-1 text-sm text-red-600">
                            <i class="fas fa-exclamation-circle mr-1"></i>
                            <span th:errors="*{title}"></span>
                        </div>
                    </div>

                    <!-- Description Field -->
                    <div>
                        <label for="description" class="block text-sm font-medium text-gray-700 mb-2">
                            <i class="fas fa-align-left mr-2 text-gray-400"></i>Description (Optional)
                        </label>
                        <textarea
                            id="description"
                            th:field="*{description}"
                            rows="4"
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-colors resize-none"
                            placeholder="Add a description for this bookmark..."
                        ></textarea>
                        <div th:if="${#fields.hasErrors('description')}" class="mt-1 text-sm text-red-600">
                            <i class="fas fa-exclamation-circle mr-1"></i>
                            <span th:errors="*{description}"></span>
                        </div>
                    </div>

                    <!-- Error Messages -->
                    <div th:if="${error}" class="bg-red-50 border border-red-200 rounded-lg p-4">
                        <div class="flex">
                            <i class="fas fa-exclamation-triangle text-red-400 mr-2 mt-0.5"></i>
                            <span class="text-sm text-red-800" th:text="${error}"></span>
                        </div>
                    </div>

                    <!-- Success Messages -->
                    <div th:if="${success}" class="bg-green-50 border border-green-200 rounded-lg p-4">
                        <div class="flex">
                            <i class="fas fa-check-circle text-green-400 mr-2 mt-0.5"></i>
                            <span class="text-sm text-green-800" th:text="${success}"></span>
                        </div>
                    </div>

                    <!-- Action Buttons -->
                    <div class="flex items-center justify-end space-x-4 pt-6">
                        <a href="/bookmarks"
                           class="px-6 py-3 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50 transition-colors">
                            Cancel
                        </a>
                        <button
                            type="submit"
                            class="px-6 py-3 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-colors duration-200 flex items-center"
                        >
                            <i class="fas fa-save mr-2"></i>
                            Save Bookmark
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

</body>
</html>
