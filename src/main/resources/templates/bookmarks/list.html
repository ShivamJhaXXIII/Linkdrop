<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bookmarks - Linkdrop</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <div class="bg-white rounded-lg shadow-md p-6">
            <div class="flex justify-between items-center mb-6">
                <h1 class="text-3xl font-bold text-gray-800">My Bookmarks</h1>
                <a href="/bookmarks/add" class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-lg transition duration-200">
                    Add Bookmark
                </a>
            </div>

            <div th:if="${bookmarks != null and not #lists.isEmpty(bookmarks.content)}" class="space-y-4">
                <div th:each="bookmark : ${bookmarks.content}" class="border rounded-lg p-4 hover:shadow-md transition duration-200">
                    <div class="flex justify-between items-start">
                        <div class="flex-1">
                            <h3 class="text-lg font-semibold text-gray-800 mb-2">
                                <a th:href="@{'/bookmarks/' + ${bookmark.id}}"
                                   th:text="${bookmark.title}"
                                   class="hover:text-blue-600 transition duration-200">
                                </a>
                            </h3>
                            <p th:text="${bookmark.description}" class="text-gray-600 text-sm mb-2"></p>
                            <a th:href="${bookmark.url}"
                               th:text="${bookmark.url}"
                               target="_blank"
                               class="text-blue-500 hover:text-blue-700 text-sm underline">
                            </a>
                            <p class="text-xs text-gray-400 mt-2" th:text="'Added on ' + ${#temporals.format(bookmark.dateTime, 'MMM dd, yyyy HH:mm')}"></p>
                        </div>
                        <div class="flex space-x-2 ml-4">
                            <a th:href="@{'/bookmarks/' + ${bookmark.id}}"
                               class="text-blue-500 hover:text-blue-700 text-sm">View</a>
                            <a th:href="@{'/bookmarks/' + ${bookmark.id} + '/edit'}"
                               class="text-green-500 hover:text-green-700 text-sm">Edit</a>
                            <form th:action="@{'/bookmarks/' + ${bookmark.id} + '/delete'}"
                                  method="post"
                                  class="inline"
                                  onsubmit="return confirm('Are you sure you want to delete this bookmark?')">
                                <button type="submit" class="text-red-500 hover:text-red-700 text-sm">Delete</button>
                            </form>
                        </div>
                    </div>
                </div>

                <!-- Pagination -->
                <div th:if="${bookmarks.totalPages > 1}" class="flex justify-center mt-8">
                    <nav class="flex space-x-2">
                        <a th:if="${bookmarks.hasPrevious()}"
                           th:href="@{/bookmarks(page=${bookmarks.number - 1})}"
                           class="px-3 py-2 bg-gray-200 text-gray-600 rounded hover:bg-gray-300">
                            Previous
                        </a>

                        <span th:each="pageNum : ${#numbers.sequence(0, bookmarks.totalPages - 1)}">
                            <a th:href="@{/bookmarks(page=${pageNum})}"
                               th:text="${pageNum + 1}"
                               th:classappend="${pageNum == bookmarks.number} ? 'bg-blue-500 text-white' : 'bg-gray-200 text-gray-600 hover:bg-gray-300'"
                               class="px-3 py-2 rounded">
                            </a>
                        </span>

                        <a th:if="${bookmarks.hasNext()}"
                           th:href="@{/bookmarks(page=${bookmarks.number + 1})}"
                           class="px-3 py-2 bg-gray-200 text-gray-600 rounded hover:bg-gray-300">
                            Next
                        </a>
                    </nav>
                </div>
            </div>

            <!-- Handle case when bookmarks is a List (non-paginated) -->
            <div th:if="${bookmarks != null and #lists.isEmpty(bookmarks.content) == null and not #lists.isEmpty(bookmarks)}" class="space-y-4">
                <div th:each="bookmark : ${bookmarks}" class="border rounded-lg p-4 hover:shadow-md transition duration-200">
                    <div class="flex justify-between items-start">
                        <div class="flex-1">
                            <h3 class="text-lg font-semibold text-gray-800 mb-2">
                                <a th:href="@{'/bookmarks/' + ${bookmark.id}}"
                                   th:text="${bookmark.title}"
                                   class="hover:text-blue-600 transition duration-200">
                                </a>
                            </h3>
                            <p th:text="${bookmark.description}" class="text-gray-600 text-sm mb-2"></p>
                            <a th:href="${bookmark.url}"
                               th:text="${bookmark.url}"
                               target="_blank"
                               class="text-blue-500 hover:text-blue-700 text-sm underline">
                            </a>
                            <p class="text-xs text-gray-400 mt-2" th:text="'Added on ' + ${#temporals.format(bookmark.dateTime, 'MMM dd, yyyy HH:mm')}"></p>
                        </div>
                        <div class="flex space-x-2 ml-4">
                            <a th:href="@{'/bookmarks/' + ${bookmark.id}}"
                               class="text-blue-500 hover:text-blue-700 text-sm">View</a>
                            <a th:href="@{'/bookmarks/' + ${bookmark.id} + '/edit'}"
                               class="text-green-500 hover:text-green-700 text-sm">Edit</a>
                            <form th:action="@{'/bookmarks/' + ${bookmark.id} + '/delete'}"
                                  method="post"
                                  class="inline"
                                  onsubmit="return confirm('Are you sure you want to delete this bookmark?')">
                                <button type="submit" class="text-red-500 hover:text-red-700 text-sm">Delete</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>

            <div th:if="${bookmarks == null or (#lists.isEmpty(bookmarks.content) and #lists.isEmpty(bookmarks))}"
                 class="text-center py-12">
                <div class="text-gray-500 text-lg mb-4">No bookmarks found</div>
                <a href="/bookmarks/add" class="bg-blue-500 hover:bg-blue-600 text-white px-6 py-3 rounded-lg transition duration-200">
                    Add Your First Bookmark
                </a>
            </div>
        </div>
    </div>
</body>
</html>
