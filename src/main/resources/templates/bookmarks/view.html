<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${bookmark.title} + ' - Linkdrop'">Bookmark - Linkdrop</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <div class="bg-white rounded-lg shadow-md p-6">
            <div class="mb-6">
                <a href="/bookmarks" class="text-blue-500 hover:text-blue-700 text-sm mb-4 inline-block">
                    ← Back to Bookmarks
                </a>
            </div>

            <div th:if="${bookmark != null}">
                <div class="border-b pb-6 mb-6">
                    <h1 th:text="${bookmark.title}" class="text-3xl font-bold text-gray-800 mb-4"></h1>

                    <div class="flex items-center space-x-4 text-sm text-gray-600 mb-4">
                        <span th:text="'Added on ' + ${#temporals.format(bookmark.dateTime, 'MMMM dd, yyyy')}"></span>
                        <span th:text="'at ' + ${#temporals.format(bookmark.dateTime, 'HH:mm')}"></span>
                    </div>

                    <div class="mb-4">
                        <a th:href="${bookmark.url}"
                           th:text="${bookmark.url}"
                           target="_blank"
                           class="text-blue-500 hover:text-blue-700 underline break-all">
                        </a>
                    </div>

                    <div th:if="${bookmark.description != null and bookmark.description != 'No description'}"
                         class="mb-6">
                        <h3 class="text-lg font-semibold text-gray-700 mb-2">Description</h3>
                        <p th:text="${bookmark.description}" class="text-gray-600 leading-relaxed"></p>
                    </div>
                </div>

                <div class="flex space-x-4">
                    <a th:href="@{'/bookmarks/' + ${bookmark.id} + '/edit'}"
                       class="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded-lg transition duration-200">
                        Edit Bookmark
                    </a>

                    <form th:action="@{'/bookmarks/' + ${bookmark.id} + '/delete'}"
                          method="post"
                          class="inline"
                          onsubmit="return confirm('Are you sure you want to delete this bookmark?')">
                        <button type="submit"
                                class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg transition duration-200">
                            Delete Bookmark
                        </button>
                    </form>

                    <a th:href="${bookmark.url}"
                       target="_blank"
                       class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-lg transition duration-200">
                        Visit Link
                    </a>
                </div>
            </div>

            <div th:if="${bookmark == null}" class="text-center py-12">
                <div class="text-gray-500 text-lg mb-4">Bookmark not found</div>
                <a href="/bookmarks" class="text-blue-500 hover:text-blue-700">Back to Bookmarks</a>
            </div>
        </div>
    </div>
</body>
</html>
