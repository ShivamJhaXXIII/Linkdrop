<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - Linkdrop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center">
    <div class="max-w-md w-full">
        <div class="bg-white rounded-lg shadow-xl p-8 text-center">
            <!-- Error Icon -->
            <div class="mx-auto h-16 w-16 flex items-center justify-center rounded-full bg-red-100 mb-6">
                <i class="fas fa-exclamation-triangle text-red-600 text-2xl"></i>
            </div>

            <!-- Error Title -->
            <h1 class="text-2xl font-bold text-gray-900 mb-4">Oops! Something went wrong</h1>

            <!-- Error Message -->
            <div th:if="${error}" class="bg-red-50 border border-red-200 rounded-lg p-4 mb-6">
                <p class="text-sm text-red-800" th:text="${error}"></p>
            </div>

            <div th:unless="${error}" class="mb-6">
                <p class="text-gray-600">We encountered an unexpected error. Please try again.</p>
            </div>

            <!-- Action Buttons -->
            <div class="space-y-3">
                <a href="/bookmarks"
                   class="w-full bg-indigo-600 text-white py-3 px-4 rounded-lg hover:bg-indigo-700 transition-colors duration-200 flex items-center justify-center">
                    <i class="fas fa-bookmark mr-2"></i>
                    Go to Bookmarks
                </a>

                <button onclick="history.back()"
                        class="w-full border border-gray-300 text-gray-700 py-3 px-4 rounded-lg hover:bg-gray-50 transition-colors duration-200 flex items-center justify-center">
                    <i class="fas fa-arrow-left mr-2"></i>
                    Go Back
                </button>
            </div>
        </div>
    </div>
</body>
</html>
